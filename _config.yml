# Site settings. Served at https://puneetha.dev by GitHub Pages (see .github/workflows/main.yaml).
# Jekyll does not reload this file during `jekyll serve`; restart after editing it.

title: Puneetha Ramachandra
author_name: Puneetha
email: puneethar92@gmail.com
description: >-
  Puneetha Ramachandra's notes on software, mostly the kind that runs
  close to the hardware.
url: "https://puneetha.dev"
baseurl: ""
github_username: Puneetha-Ramachandra
resume_url: https://www.linkedin.com/in/puneetha

# Analytics and comments are off. To turn them on, set e.g.
#   google_analytics: G-XXXXXXXXXX
#   disqus:
#     shortname: your-disqus-shortname
# and add `comments: true` to a post's front matter for Disqus.

# Build settings
markdown: kramdown
theme: dev-portfolio-blog
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jemoji
  - jekyll-minifier

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - .jekyll-cache/

pwa: true

############################################################
# jekyll-paginate-v2
pagination:
  enabled: true
  collection: "posts"
  per_page: 10
  permalink: "/blog/:num/"
  title: ":title - page :num"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  trail:
    before: 2
    after: 2

############################################################
# jekyll-minifier
jekyll-minifier:
  preserve_php: true
  remove_spaces_inside_tags: true
  remove_multi_spaces: true
  remove_comments: true
  remove_intertag_spaces: true
  remove_quotes: false
  compress_css: true
  compress_javascript: true
  compress_json: true
  simple_doctype: false
  remove_script_attributes: false
  remove_style_attributes: false
  remove_link_attributes: false
  remove_form_attributes: false
  remove_input_attributes: false
  remove_javascript_protocol: false
  remove_http_protocol: false
  remove_https_protocol: false
  preserve_line_breaks: false
  simple_boolean_attributes: false
  compress_js_templates: false
